<title>عجلة الحظ</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Zain:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--or:#eb5e28;--dk:#2c2324;--dk2:#1e1718;--br:#766754;--cr:#efece3;--gd:#f2b950}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
body{background:radial-gradient(ellipse at 50% 30%,#4a2a22 0,var(--dk) 45%,var(--dk2) 100%) fixed;color:var(--cr);font-family:'Zain',Tahoma,sans-serif;text-align:center;padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
.logo{width:72px;height:72px;border-radius:18px;margin-bottom:10px;box-shadow:0 0 0 3px var(--gd),0 8px 24px #0008}
h1{font:400 40px 'Lalezar','Zain',sans-serif;margin:0;color:var(--gd);text-shadow:0 3px 0 #a3391a,0 6px 18px #0009;line-height:1.2}
p.sub{margin:2px 0 18px;font-size:19px;color:#cfc4b2}
.wrap{position:relative;width:min(80vw,380px);aspect-ratio:1;margin-top:10px}
.wrap::before{content:"";position:absolute;inset:-4%;border-radius:50%;background:radial-gradient(circle,#eb5e2866,transparent 68%);z-index:0}
.ptr{position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:3;width:34px;height:44px;background:linear-gradient(#fff6dc,var(--gd));clip-path:polygon(50% 100%,0 25%,10% 0,90% 0,100% 25%);filter:drop-shadow(0 3px 3px #000a)}
#wheel{position:relative;z-index:1;width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 14px 40px #000a}
.hub{position:absolute;inset:0;margin:auto;width:21%;aspect-ratio:1;border-radius:50%;border:5px solid var(--gd);z-index:2;box-shadow:0 0 0 4px var(--dk),0 4px 14px #000a;background:var(--dk)}
#form{margin-top:30px;width:min(86vw,380px)}
#ph{width:100%;padding:14px 18px;border-radius:16px;border:2px solid var(--br);background:#00000040;color:var(--cr);font:700 22px 'Zain',Tahoma,sans-serif;text-align:center;letter-spacing:1px;direction:ltr;outline:0}
#ph:focus{border-color:var(--gd)}
#ph::placeholder{color:#8f8372;direction:rtl;letter-spacing:0}
#err{min-height:24px;color:#ff9b7a;font-size:17px;margin:6px 0 0}
button{margin-top:6px;background:linear-gradient(#f57a45,var(--or));color:#fff;border:0;border-radius:40px;padding:14px 56px;font:900 24px 'Zain',Tahoma,sans-serif;cursor:pointer;box-shadow:0 5px 0 #a3391a,0 10px 22px #0007;transition:transform .1s,box-shadow .1s}
button:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #a3391a}
button:disabled{background:var(--br);box-shadow:none;cursor:default;opacity:.75}
button:focus-visible,#ph:focus-visible{outline:3px solid var(--gd);outline-offset:3px}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#ov.on{display:flex}
.card{position:relative;width:min(92vw,400px);background:var(--cr);color:var(--dk);border-radius:28px;padding:34px 24px 26px;border:5px solid var(--gd);box-shadow:0 20px 60px #000;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.card .em{font-size:54px;line-height:1}
.card h2{font:400 36px 'Lalezar','Zain',sans-serif;color:var(--or);margin:8px 0 2px}
.card small{display:block;color:var(--br);font-size:19px}
.card b{display:block;background:var(--dk);color:var(--gd);border-radius:18px;padding:14px 10px;font-size:30px;font-weight:900;margin:14px 0;line-height:1.35}
.card .note{font-size:17px}
#cf{position:fixed;inset:0;pointer-events:none;z-index:11}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style></head><body>

<div id="ov"><div class="card"><div class="em">🎉</div><h2>مبروك! لقد ربحت معنا</h2><small>هديتك هي</small><b id="pz"></b><div class="note">فرصة واحدة فقط — صوّر الشاشة وابعتها لمدير حسابك.</div></div></div>
<canvas id="cf"></canvas>
<script>
/* ===== حط هنا رابط Google Apps Script (Web app URL) ===== */
const SHEET_URL='https://script.google.com/macros/s/AKfycbxFxi4SV850hm-PRjIYY0EFfJePay8ybI9ZRsMx1L_giVx9Y_zFBXb87CuVKqIW7WY4/exec';
/* ======================================================== */
const W={
packages:{t:'عجلة هدايا الباقات',s:'باقات 3 شهور / 6 شهور / السنة',p:['شهر إدارة حملات إعلانية\nهدية','شهر SEO\nهدية','شهر سوشيال ميديا\nهدية','5 مشاهير / انفلونسرز\nهدية']},
monthly:{t:'عجلة هدايا الباقة الشاملة',s:'باقة الشهر الشامل',p:['2 انفلونسرز\nزيادة هدية','خصم 25%\nعلى التجديد','5 تصاميم\nزيادة هدية','2 فيديو موشن\nهدية']}};
const COL=[['#eb5e28','#fff'],['#efece3','#2c2324'],['#766754','#fff'],['#3f3436','#f2b950']];
const cv=document.getElementById('wheel'),ctx=cv.getContext('2d'),btn=document.getElementById('go'),ov=document.getElementById('ov'),ph=document.getElementById('ph'),err=document.getElementById('err');
let id='packages',busy=false;
const k=()=>'jz_wheel_'+id;
function get(){try{return JSON.parse(localStorage.getItem(k()))}catch(e){return null}}
function put(v){try{localStorage.setItem(k(),JSON.stringify(v))}catch(e){}}
function draw(p){const n=p.length,a=2*Math.PI/n,C=400;ctx.clearRect(0,0,800,800);
ctx.beginPath();ctx.arc(C,C,398,0,7);ctx.fillStyle='#f2b950';ctx.fill();
ctx.beginPath();ctx.arc(C,C,368,0,7);ctx.fillStyle='#a3391a';ctx.fill();
for(let i=0;i<24;i++){const t=i*Math.PI/12;ctx.beginPath();ctx.arc(C+383*Math.cos(t),C+383*Math.sin(t),8,0,7);ctx.fillStyle=i%2?'#fff6dc':'#eb5e28';ctx.fill()}
p.forEach((txt,i)=>{const s=-Math.PI/2+i*a;ctx.beginPath();ctx.moveTo(C,C);ctx.arc(C,C,350,s,s+a);ctx.closePath();ctx.fillStyle=COL[i%4][0];ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#f2b950';ctx.stroke();
ctx.save();ctx.translate(C,C);const m=s+a/2,f=Math.cos(m)<0;ctx.rotate(f?m+Math.PI:m);
ctx.fillStyle=COL[i%4][1];ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';
const x=f?-222:222,maxW=235,H=185;let fs=62,lines;
const wr=()=>{ctx.font='900 '+fs+'px Zain,Tahoma,sans-serif';const o=[];txt.split('\n').forEach(g=>{let c='';g.split(' ').forEach(w=>{const t=c?c+' '+w:w;if(c&&ctx.measureText(t).width>maxW){o.push(c);c=w}else c=t});o.push(c)});return o};
for(;;){lines=wr();if((lines.length*fs*1.15<=H&&lines.every(l=>ctx.measureText(l).width<=maxW))||fs<=24)break;fs-=2}
lines.forEach((l,j)=>ctx.fillText(l,x,(j-(lines.length-1)/2)*(fs*1.15)));ctx.restore()})}
function show(p,i){document.getElementById('pz').textContent=p[i].replace('\n',' — ');ov.classList.add('on');confetti()}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=document.getElementById('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
const cols=['#eb5e28','#f2b950','#efece3','#fff'],ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,w:6+Math.random()*6,h:10+Math.random()*8,v:2+Math.random()*4,r:Math.random()*6,d:(Math.random()-.5)*.2,c:cols[Math.random()*4|0]}));
let f=0;(function a(){x.clearRect(0,0,c.width,c.height);ps.forEach(q=>{q.y+=q.v;q.r+=q.d;q.x+=Math.sin(q.r)*1.5;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.w/2,-q.h/2,q.w,q.h);x.restore()});if(++f<260)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
function lock(st){btn.disabled=true;btn.textContent='تم استخدام فرصتك';ph.value=st.phone||'';ph.disabled=true}
function init(){id=location.hash==='#monthly'?'monthly':'packages';const w=W[id];
document.getElementById('t').textContent=w.t;document.getElementById('s').textContent=w.s;draw(w.p);
cv.style.transition='none';ov.classList.remove('on');busy=false;err.textContent='';
const st=get();if(st){cv.style.transform='rotate('+st.deg+'deg)';lock(st);show(w.p,st.i)}
else{cv.style.transform='rotate(0deg)';btn.disabled=false;btn.textContent='لفّ العجلة';ph.disabled=false;ph.value=''}}
function send(d){if(!SHEET_URL)return;try{fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d)})}catch(e){}}
ov.onclick=e=>{if(e.target===ov)ov.classList.remove('on')};
btn.onclick=()=>{if(busy||get())return;
let dg=ph.value.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g,'').replace(/^00966/,'').replace(/^966/,'').replace(/^0/,'');const phone='0'+dg;
if(!/^5\d{8}$/.test(dg)){err.textContent='اكتب رقم جوال سعودي صحيح (مثال 0501234567)';ph.focus();return}
err.textContent='';busy=true;btn.disabled=true;ph.disabled=true;const w=W[id],n=w.p.length,seg=360/n;
const r=new Uint32Array(2);crypto.getRandomValues(r);const i=r[0]%n,jit=(r[1]/4294967295-.5)*seg*.6;
const deg=360*6-(i*seg+seg/2+jit);put({i,deg,phone});
send({wheel:id,phone,prize:w.p[i].replace('\n',' — ')});
void cv.offsetWidth;cv.style.transition='transform 5.5s cubic-bezier(.12,.6,.1,1)';cv.style.transform='rotate('+deg+'deg)';
setTimeout(()=>{btn.textContent='تم استخدام فرصتك';show(w.p,i)},5700)};
addEventListener('hashchange',init);init();
</script></body></html>
